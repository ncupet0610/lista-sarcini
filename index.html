<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de sarcini</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Lista de sarcini</h1>

    <form id="formular">
      <input type="text" id="campText" placeholder="Scrie o sarcină nouă..." autocomplete="off">
      <button type="submit">Adaugă</button>
    </form>

    <ul id="lista"></ul>

    <div class="bara-jos">
      <span id="contor"></span>

      <div class="filtre">
        <button id="filtruToate" class="filtru">Toate</button>
        <button id="filtruActive" class="filtru">Active</button>
        <button id="filtruTerminate" class="filtru">Terminate</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
